schemaVersion: 1
documentType: requirement
frontMatter:
  type: object
  required: [id, owner, priority]
  properties:
    id: {type: string, minLength: 1}
    owner: {type: string, minLength: 1}
    priority: {enum: [critical, normal]}
identity: {field: frontMatter.id, uniqueWithin: workspace}
body:
  sections:
    - {title: Acceptance Criteria, nonEmpty: true}
