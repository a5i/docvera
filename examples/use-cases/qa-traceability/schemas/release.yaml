schemaVersion: 1
documentType: release
frontMatter:
  type: object
  required: [id, owner]
  properties:
    id: {type: string, minLength: 1}
    owner: {type: string, minLength: 1}
identity: {field: frontMatter.id, uniqueWithin: workspace}
relations:
  - {from: frontMatter.requirements, targetType: requirement, min: 1}
body:
  sections:
    - {title: Scope, nonEmpty: true}
