schemaVersion: 1
documentType: test-execution
frontMatter:
  type: object
  required: [id, owner, executedAt, result]
  properties:
    id: {type: string, minLength: 1}
    owner: {type: string, minLength: 1}
    executedAt: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}
    result: {enum: [passed, failed]}
identity: {field: frontMatter.id, uniqueWithin: workspace}
relations:
  - {from: frontMatter.test, targetType: test-case, min: 1, max: 1}
  - {from: frontMatter.release, targetType: release, min: 1, max: 1}
body:
  sections:
    - {title: Evidence, nonEmpty: true}
