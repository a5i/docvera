schemaVersion: 1
documentType: initiative
frontMatter:
  type: object
  required: [id, owner]
  properties:
    id: {type: string, minLength: 1}
    owner: {type: string, minLength: 1}
identity: {field: frontMatter.id, uniqueWithin: workspace}
relations:
  - {from: frontMatter.vision, targetType: vision, min: 1, max: 1}
body:
  sections:
    - {title: Goals, nonEmpty: true}
