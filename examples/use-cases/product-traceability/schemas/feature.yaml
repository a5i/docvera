schemaVersion: 1
documentType: feature
frontMatter:
  type: object
  required: [id, owner, status]
  properties:
    id: {type: string, minLength: 1}
    owner: {type: string, minLength: 1}
    status: {enum: [draft, planned, delivered]}
    epic: {type: string, minLength: 1}
identity: {field: frontMatter.id, uniqueWithin: workspace}
relations:
  - {from: frontMatter.initiative, targetType: initiative, min: 1, max: 1}
  - {from: frontMatter.requirements, targetType: requirement, min: 1}
  - {from: frontMatter.epic, targetType: jira-epic, max: 1}
body:
  sections:
    - {title: Problem, nonEmpty: true}
    - {title: Value, nonEmpty: true}
    - {title: Success Metrics, nonEmpty: true}
