schemaVersion: 1
documentType: milestone
frontMatter:
  type: object
  required: [id, owner]
  properties:
    id: {type: string, minLength: 1}
    owner: {type: string, minLength: 1}
identity: {field: frontMatter.id, uniqueWithin: workspace}
relations:
  - {from: frontMatter.charter, targetType: project-charter, min: 1, max: 1}
  - {from: frontMatter.deliverables, targetType: jira-epic, min: 1}
body:
  sections:
    - {title: Target, nonEmpty: true}
