schemaVersion: 1
documentType: jira-epic
frontMatter:
  type: object
  required: [id, owner, status, source, capturedAt]
  properties:
    id: {type: string, minLength: 1}
    owner: {type: string, minLength: 1}
    status: {enum: [planned, in-progress, done]}
    source: {const: jira-snapshot}
    capturedAt: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}
identity: {field: frontMatter.id, uniqueWithin: workspace}
relations:
  - {from: frontMatter.specification, targetType: specification, min: 1, max: 1}
body:
  sections:
    - {title: Summary, nonEmpty: true}
