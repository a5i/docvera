schemaVersion: 1
documentType: project-charter
frontMatter:
  type: object
  required: [id, owner]
  properties:
    id: {type: string, minLength: 1}
    owner: {type: string, minLength: 1}
identity: {field: frontMatter.id, uniqueWithin: workspace}
body:
  sections:
    - {title: Scope, nonEmpty: true}
    - {title: Goals, nonEmpty: true}
    - {title: Stakeholders, nonEmpty: true}
