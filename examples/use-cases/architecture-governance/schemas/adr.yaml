schemaVersion: 1
documentType: adr
frontMatter:
  type: object
  required: [id, owner, status]
  properties:
    id: {type: string, minLength: 1}
    owner: {type: string, minLength: 1}
    status: {enum: [proposed, accepted, deprecated]}
identity: {field: frontMatter.id, uniqueWithin: workspace}
relations:
  - {from: frontMatter.components, targetType: component}
body:
  sections:
    - {title: Context, nonEmpty: true}
    - {title: Decision, nonEmpty: true}
    - {title: Consequences, nonEmpty: true}
