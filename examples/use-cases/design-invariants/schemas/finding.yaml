schemaVersion: 1
documentType: finding
frontMatter:
  type: object
  required: [id, owner, status, entity]
  properties:
    id: {type: string, pattern: '^FIND-[0-9]+$'}
    owner: {type: string, minLength: 1}
    status: {enum: [open, resolved]}
    entity: {type: array, minItems: 1, items: {type: string}}
  additionalProperties: false
identity: {field: frontMatter.id, uniqueWithin: workspace}
relations:
  - {from: frontMatter.entity, targetType: interaction-pattern, min: 1}
body:
  sections:
    - {title: Context, nonEmpty: true}
    - {title: Proposal, nonEmpty: true}
