schemaVersion: 1
documentType: rule
frontMatter:
  type: object
  required: [id, owner, lifecycle, governedBy]
  properties:
    id: {type: string, pattern: '^RULE-[0-9]+$'}
    owner: {type: string, minLength: 1}
    lifecycle: {enum: [draft, reviewed, stable, deprecated]}
    governedBy: {type: array, minItems: 1, items: {type: string}}
  additionalProperties: false
identity: {field: frontMatter.id, uniqueWithin: workspace}
relations:
  - {from: frontMatter.governedBy, targetType: principle, min: 1}
body:
  sections:
    - {title: Statement, nonEmpty: true}
    - {title: Rationale, nonEmpty: true}
