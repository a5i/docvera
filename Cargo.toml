[workspace]
members = ["crates/docvera-engine", "crates/docvera-cli", "crates/docvera-node"]
default-members = ["crates/docvera-engine", "crates/docvera-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
docvera-engine = { path = "crates/docvera-engine", version = "0.1.0" }
