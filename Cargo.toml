[workspace]
members = ["crates/md-engine", "crates/md-cli", "crates/md-node"]
default-members = ["crates/md-engine", "crates/md-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-engine = { path = "crates/md-engine" }
