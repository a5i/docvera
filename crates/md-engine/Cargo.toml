[package]
name = "md-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["index", "shacl"]
index = ["dep:rusqlite"]
shacl = ["dep:shacl", "dep:rudof_rdf", "dep:oxrdf"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = "1"
serde-saphyr = "2.0"
jsonschema = { version = "0.59", default-features = false }
pulldown-cmark = "0.13"
rusqlite = { version = "0.40", features = ["bundled", "hooks"], optional = true }
globset = "0.4"
walkdir = "2"
blake3 = "1"
regex = "1"
percent-encoding = "2"
toml = "0.9"
shacl = { version = "=0.3.29", features = ["sparql"], optional = true }
rudof_rdf = { version = "=0.3.29", default-features = false, optional = true }
oxrdf = { version = "=0.3.5", optional = true }

[dev-dependencies]
tempfile = "3"
