[package]
name = "docvera-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "CLI for docvera: validate, index and query Markdown knowledge bases"
readme = "../../README.md"
keywords = ["markdown", "cli", "validation", "documentation", "knowledge-base"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "docvera"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
docvera-engine.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
