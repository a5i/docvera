# cargo-deny configuration
# Docs: https://embarkstudios.github.io/cargo-deny/
# Run locally: cargo deny check

[advisories]
version = 2
yanked = "deny"
# Ignored advisories must each carry a reason and be revisited when the
# blocking upstream ships a fix.
ignore = [
    # quick-xml 0.37 DoS: quadratic duplicate-attribute check + unbounded
    # namespace allocation. Fix requires quick-xml >= 0.41, but oxrdfxml 0.2.x
    # / sparesults 0.3.x (via oxigraph 0.5 / rudof 0.3) semver-pin 0.37.
    # XML/RDF input here is developer-supplied, not untrusted network input.
    # Remove when upstream bumps quick-xml.
    { id = "RUSTSEC-2026-0194", reason = "no patched quick-xml 0.37.x; blocked on oxigraph/rudof bump to quick-xml >= 0.41" },
    { id = "RUSTSEC-2026-0195", reason = "no patched quick-xml 0.37.x; blocked on oxigraph/rudof bump to quick-xml >= 0.41" },
    # Unmaintained transitive deps inside rudof_rdf 0.3's tree; not fixable
    # from this repo. Revisit on the next rudof upgrade.
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; transitive via rudof_rdf, upstream must drop it" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained; transitive via tabled -> rudof_rdf" },
]

[licenses]
version = 2
# Licenses compatible with this repo's MIT licensing.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "MPL-2.0",
  "BSD-2-Clause-Patent",
]
confidence-threshold = 0.93

[bans]
# Deny multiple versions of the same crate (reported as warnings first).
multiple-versions = "warn"
# Wildcard dependencies ("*") make builds non-reproducible.
wildcards = "deny"
highlight = "simplest-path"

[sources]
# Only allow dependencies from crates.io, plus rust-lang/rust toolchain
# components (e.g. for -Zbuild-std). Everything else (random git repos,
# sparse mirrors) must be explicitly allowed here.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/rust-lang/rust"]
