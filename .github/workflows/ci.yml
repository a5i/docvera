name: Cross-platform prototype
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checker-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: checker-only
      - run: cargo test --locked -p docvera-engine --no-default-features
      - run: cargo test --locked -p docvera-engine --no-default-features --features index
      - run: cargo test --locked -p docvera-engine --no-default-features --features shacl
      - run: cargo build --locked -p docvera-engine --no-default-features --target wasm32-unknown-unknown
  test-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            binary: docvera
          - os: ubuntu-24.04-arm
            name: linux-arm64
            binary: docvera
          - os: macos-15-intel
            name: macos-x64
            binary: docvera
          - os: macos-latest
            name: macos-arm64
            binary: docvera
          - os: windows-latest
            name: windows-x64
            binary: docvera.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked -p docvera-cli
      - run: npm --prefix npm/docvera run build
      - run: npm --prefix npm/docvera test
      - run: cargo build --locked --release -p docvera-cli
      - run: npm --prefix npm/docvera run build:release
      - name: Test release native addon against release CLI
        run: npm --prefix npm/docvera test
        env:
          DOCVERA_BIN: ${{ github.workspace }}/target/release/${{ matrix.binary }}
      - name: Pack platform-specific native package
        working-directory: npm/docvera
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: docvera-${{ matrix.name }}
          path: |
            target/release/${{ matrix.binary }}
            npm/docvera/*.tgz
            docs/contracts/v1.json
            LICENSE
          if-no-files-found: error
