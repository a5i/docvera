name: Agent skill installers

on:
  push:
    paths:
      - "skills/**"
      - "scripts/skills-installers.test.mjs"
      - "apm.yml"
      - ".gitattributes"
      - ".github/workflows/skills.yml"
  pull_request:
    paths:
      - "skills/**"
      - "scripts/skills-installers.test.mjs"
      - "apm.yml"
      - ".gitattributes"
      - ".github/workflows/skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tested APM CLI
        run: python -m pip install apm-cli==0.33.0
      - name: Verify isolated collection and selective installs
        run: node --test scripts/skills-installers.test.mjs
